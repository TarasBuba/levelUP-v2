name = "levelup-cleaning-edmonton"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Cloudflare KV namespace binding for `/api/slots` and Telegram `/slots <0-9>` admin updates.
# Replace placeholder IDs below after running `wrangler kv namespace create LEVELUP_KV`.
[[kv_namespaces]]
binding = "LEVELUP_KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

# Production secrets are managed via `wrangler pages secret put <SECRET_NAME>` (never in git):
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_WEBHOOK_SECRET
# - META_PIXEL_ID
# - META_CAPI_TOKEN
